[package]
name = "livekit-feed-base"
version = "0.5.0"
edition = "2024"
authors = ["stackinspector"]
license = "MPL-2.0"
repository = "https://github.com/livekit-neo/livekit-neo"

[lib]
name = "livekit_feed_base"
path = "lib.rs"

[dependencies]
bytes = "1"
hex = "0.4"
brotli-decompressor = "6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
futures-util = "0.3"
async-io = "2"
async-net = "2"
async-tungstenite = { version = "0.35", features = ["smol-runtime", "futures-rustls-webpki-roots"] }
async-global-executor = "3"
foundations = { git = "https://github.com/Berylsoft/foundations", features = ["byterepr", "byterepr-macros", "error-enum"] }

[dev-dependencies]
hex-literal = "1"
